name: Build Color Wins Fabric Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: color-wins-1.21.2
          path: build/libs/*.jar
          if-no-files-found: error
